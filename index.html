<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PricePilot – MVP prototype</title>
<style>
:root{--navy:#12305c;--or:#ff9f1a;--ink:#1d2433;--mute:#5a6b86;--line:#dde3ee;--bg:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid #3b9be8;outline-offset:2px}
header{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 28px}
.brand{font-size:22px;font-weight:700}.brand small{font-size:14px;font-weight:400;margin-left:4px}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav button{background:none;border:0;color:#c5d0e4;padding:6px 0;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--or)}
main{padding:28px;max-width:1100px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{margin:0 0 8px;font-size:18px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c5cee0;border-radius:8px;background:#fff;color:var(--ink)}
input[type=file]{padding:8px;background:#fafbfd}
input:disabled{opacity:.5;cursor:not-allowed}
select{background:#eee}
textarea{font-family:monospace;min-height:56px}
.btn{border:0;border-radius:8px;padding:12px 18px;color:#fff;background:var(--navy);cursor:pointer;margin-top:8px}
.btn.or{background:var(--or);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ok{background:#1f9d55;border-radius:8px;padding:12px 22px;color:#fff;border:0;cursor:pointer;font-weight:700;font-size:15px}
.no{background:#fff;color:#b42525;border:2px solid #b42525;border-radius:8px;padding:10px 20px;cursor:pointer;font-weight:700;font-size:15px}
.ghost{background:#fff;color:var(--ink);border:1px solid #c5cee0;border-radius:8px;padding:8px 14px;cursor:pointer}
.small{font-size:13px;color:var(--mute)}
.demo{display:inline-block;background:#fdebc8;color:#8a5a00;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:8px;vertical-align:middle}
.opt{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:16px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.opt input{width:auto;margin-top:4px}.opt.sel{border-color:var(--navy);background:#f4f8ff}.opt small{display:block;color:var(--mute);font-size:13px}
.list p{margin:0;padding:8px 0}
.flow{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.flow li{display:flex;gap:10px;align-items:center;padding:8px 0}
.flow span{background:var(--navy);color:#fff;width:24px;height:24px;border-radius:50%;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);padding:10px 8px}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr.done td{background:#eaf7ee}
tr.rej td{background:#f6f6f6;color:var(--mute)}
.pill{font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px}
.raise{background:#d9f2e3;color:#1b7a45}.lower{background:#fde1e1;color:#b42525}.hold{background:#fdebc8;color:#8a5a00}
.rs{font-size:15px;color:var(--ink);min-width:240px;width:36%}
.acts{white-space:nowrap}
.tg{background:#e8f0fb;border-left:4px solid #3b9be8;border-radius:6px;padding:12px 14px;margin-top:12px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kp .card{text-align:center;margin:0 0 16px}.kp b{display:block;font-size:34px}
.stars button{background:none;border:0;font-size:32px;color:#c5cae0;cursor:pointer;padding:0 4px}
.stars button.on{color:var(--or);text-shadow:0 0 1px #b36b00}
.formula{background:#f4f6fa;border-radius:8px;padding:10px 12px;font-family:monospace;font-size:14px;margin-top:10px}
.scroll{overflow-x:auto}
@media(max-width:760px){.grid,.kp{grid-template-columns:1fr}header{padding:14px}main{padding:16px}.rs{min-width:180px}}
</style>
</head>
<body>
<header><div class="brand">PricePilot<small>MVP prototype - Recommend mode</small></div><nav id="nav"></nav></header>
<main id="v"></main>
<script>
const TABS=["1. Connect","2. Rules","3. Recommendations","4. Report & feedback"];
const S={t:0,margin:12,dec:{},rating:0,sent:false,cm:"",shop:"TechHome KZ",tg:"@techhome_kz",mode:"upload",xml:"",csv:""};
const R=[
 {id:0,n:"Redmi Buds 5",now:9200,sug:9900,cost:7400,r:"2 rivals out of stock; you hold 40 units"},
 {id:1,n:"Car vacuum Baseus",now:11500,sug:11200,cost:9500,r:"Rival -300 KZT; margin stays about 15 %, sales are slow"},
 {id:2,n:"Air fryer 4L",now:24900,sug:24900,cost:21500,r:"Price war: 3 undercuts today; going lower would push you below your floor"}];
const f=n=>n.toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Floor = cost / (1 - margin), margin is a share of the SELLING price; rounded UP to 10 KZT
const floor=c=>Math.ceil(c/(1-S.margin/100)/10-1e-9)*10;
const ACT=(p,now)=>p>now?["Raise","raise"]:p<now?["Lower","lower"]:["Hold","hold"];
function nav(){document.getElementById("nav").innerHTML=TABS.map((x,i)=>`<button data-t="${i}" class="${i==S.t?'on':''}">${x}</button>`).join("")}
function v0(){const up=S.mode=="upload";return `<h1>Start your 14-day free trial</h1><p class="sub">For Kaspi.kz sellers. No password required.</p>
<div class="grid"><div class="card"><h3>Connect your shop</h3>
<label for="a">Shop name</label><input id="a" value="${esc(S.shop)}">
<label for="b">Telegram contact</label><input id="b" value="${esc(S.tg)}">
<label>Choose data source</label>
<label class="opt ${up?'sel':''}"><input type="radio" name="ds" value="upload" ${up?'checked':''}><span>Upload your files<small>Kaspi XML price list + CSV (cost and stock)</small></span></label>
${up?`<label for="xf">Kaspi XML price list</label><input id="xf" type="file" accept=".xml,text/xml,application/xml">${S.xml?`<span class="small">Selected: ${esc(S.xml)}</span>`:''}
<label for="cf">CSV: SKU, cost price, stock</label><input id="cf" type="file" accept=".csv,text/csv">${S.csv?`<span class="small">Selected: ${esc(S.csv)}</span>`:''}`:''}
<label class="opt ${up?'':'sel'}"><input type="radio" name="ds" value="sample" ${up?'':'checked'}><span>Use sample data <span class="demo">Demo data</span><small>Explore the prototype with 25 demo products.</small></span></label>
<p class="small"><b>Pilot size: 25 SKUs</b></p>
<button class="btn or" data-t="1">Continue</button></div>
<div class="card list"><h3>What you get</h3><p>Profit-based price recommendations</p><p>Alerts when rivals run out of stock</p><p>A price floor that can never be broken</p>
<ol class="flow"><li><span>1</span>Connect data</li><li><span>2</span>Set rules</li><li><span>3</span>Review prices</li><li><span>4</span>Track profit</li></ol>
<span class="small"><b>Default mode: Recommend.</b> You stay in control. Approved prices are added to your XML file for the next upload to Kaspi.</span>
<p class="small">Free trial: 14 days<br>MVP beta testing: 4-6 weeks</p></div></div>`}
function v1(){const fl=floor(7400);return `<h1>Set your safety rules</h1><p class="sub">PricePilot will never recommend a price outside these limits.</p>
<div class="grid"><div class="card"><label for="m">Minimum profit margin (%)</label><input id="m" type="number" min="1" max="60" value="${S.margin}">
<span class="small">The recommended price can never fall below your minimum profit margin. Margin is counted from the selling price.</span>
<div class="formula">Floor = cost / (1 - margin)</div>
<label for="w">Maximum discount per week</label><select id="w"><option>3 % (Kaspi discount badge rule)</option><option>5 %</option><option>10 %</option></select>
<label for="ch">Alert channel</label><select id="ch"><option>Telegram - one-click approve</option><option>Web dashboard only</option></select></div>
<div class="card"><h3>Example: Xiaomi Redmi Buds 5</h3><table><tr><td>Cost price</td><td>7,400 KZT</td></tr><tr><td>Floor (${S.margin} % margin)</td><td><b>${f(fl)} KZT</b></td></tr><tr><td>Current price</td><td>9,200 KZT</td></tr></table>
<div class="formula">7,400 / (1 - ${S.margin/100}) = ${(7400/(1-S.margin/100)).toFixed(2)} -> ${f(fl)} KZT (rounded up to 10)</div>
<p class="small">Bots following the leader would go to the floor. PricePilot first checks if first place pays off.</p></div></div>
<button class="btn" data-t="2">Save rules and see recommendations</button>`}
function v2(){const n=Object.keys(S.dec).length,w=R.length-n;
const rows=R.map(x=>{const d=S.dec[x.id],p=Math.max(x.sug,floor(x.cost)),[a,c]=ACT(p,x.now);
const act=d?`<b>${d=="y"?(c=="hold"?"Hold confirmed":"Approved"):"Rejected"}</b> <button class="ghost" data-u="${x.id}">Undo</button>`:
(c=="hold"?`<button class="ok" data-d="${x.id}:y">OK</button>`:`<button class="ok" data-d="${x.id}:y">Approve</button> <button class="no" data-d="${x.id}:n">Reject</button>`);
return `<tr class="${d=="y"?'done':d=="n"?'rej':''}"><td>${x.n}</td><td>${f(x.now)}</td><td><b>${f(p)}</b></td><td><span class="pill ${c}">${a}</span></td><td class="rs">${x.r}</td><td class="acts">${act}</td></tr>`}).join("");
return `<h1>Today's recommendations</h1><p class="sub">${w} change${w==1?'':'s'} waiting for your approval. Nothing is changed without you.</p>
<div class="card scroll"><table><tr><th>Product</th><th>Now</th><th>Suggested</th><th>Action</th><th>Reason</th><th></th></tr>${rows}</table>
<div class="tg"><b>Telegram preview:</b> Redmi Buds 5: raise 9,200 to 9,900 KZT. Reason: 2 rivals out of stock. Reply 1 to approve, 2 to reject.</div></div>
${n?`<p class="small">Decision saved. Approved changes are added to your Kaspi XML price list for the next hourly update; you upload the file to Kaspi.</p>`:''}
<button class="btn" data-t="3" ${w==0?'':'disabled'}>View weekly report</button>
${w?`<span class="small"> Review all ${R.length} recommendations to continue.</span>`:''} <button class="ghost" data-reset>Reset demo</button>`}
function v3(){const n=Object.keys(S.dec).length;return `<h1>Weekly profit report<span class="demo">Sample data for the demo</span></h1><p class="sub">Pilot group (25 SKUs), week 1, compared with a control group of SKUs that PricePilot does not touch.</p>
<div class="kp"><div class="card"><b>${n} of 3</b>recommendations reviewed</div><div class="card"><b>+6.8 %</b>gross profit per SKU vs. control group</div><div class="card"><b>1</b>price war avoided<div class="small">Counted when 2+ rivals undercut and PricePilot held the price instead of falling below your floor.</div></div></div>
<div class="card"><h3>${S.sent?'Thank you for your feedback':'Was this week useful?'}</h3>${S.sent?`<p>Saved. You rated this week ${S.rating} of 5. The team will contact you for a 15-minute call.</p>`:`
<div class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=S.rating?'on':''}" data-s="${i}" aria-label="${i} of 5" aria-pressed="${i==S.rating}">★</button>`).join("")}</div>
<div class="small">${S.rating?`Your rating: ${S.rating} of 5`:'Tap a star to rate'}</div>
<label for="cm">What was missing or confusing?</label><textarea id="cm" placeholder="Short comment for the PricePilot team">${esc(S.cm)}</textarea>
<button class="btn or" data-send ${S.rating?'':'disabled'}>Send feedback</button>`}</div>`}
function render(){nav();document.getElementById("v").innerHTML=[v0,v1,v2,v3][S.t]();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.t!==undefined){S.t=+d.t;render()}
 else if(d.d){const[i,v]=d.d.split(":");S.dec[i]=v;render()}
 else if(d.u){delete S.dec[d.u];render()}
 else if(d.reset!==undefined){S.dec={};S.rating=0;S.sent=false;S.cm="";render()}
 else if(d.s){S.rating=+d.s;render()}
 else if(d.send!==undefined){try{const k=JSON.parse(localStorage.getItem("pp_feedback")||"[]");k.push({rating:S.rating,comment:S.cm,decisions:S.dec,at:new Date().toISOString()});localStorage.setItem("pp_feedback",JSON.stringify(k))}catch(_){}S.sent=true;render()}});
document.addEventListener("input",e=>{const i=e.target.id;if(i=="a")S.shop=e.target.value;else if(i=="b")S.tg=e.target.value;else if(i=="cm")S.cm=e.target.value});
document.addEventListener("change",e=>{const i=e.target.id;
 if(i=="m"){S.margin=Math.min(60,Math.max(1,+e.target.value||12));render()}
 else if(e.target.name=="ds"){S.mode=e.target.value;render()}
 else if(i=="xf"){S.xml=e.target.files[0]?e.target.files[0].name:"";render()}
 else if(i=="cf"){S.csv=e.target.files[0]?e.target.files[0].name:"";render()}});
render();
</script>
</body>
</html>
